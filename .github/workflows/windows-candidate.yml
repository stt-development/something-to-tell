name: Windows candidate (manual, not a release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Assert native architecture and record tools
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') { throw 'Native x64 runner required' }
          Write-Output "Runner image $env:ImageOS $env:ImageVersion"
          rustc --version --verbose
          cargo --version
          node --version
          python --version
          uv --version
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.15.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'workspace install failed' }
          uv sync --all-extras --group build --locked
          if ($LASTEXITCODE -ne 0) { throw 'runtime install failed' }
      - name: Build and verify native runtime resources
        run: |
          $built = uv run --group build python -m services.runtime.scripts.build_desktop_runtime | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'runtime build failed' }
          $staged = node tools/desktop-runtime-resources.mjs $built.candidate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'runtime staging failed' }
          "STT_TEST_DESKTOP_RUNTIME_EXECUTABLE=$(Join-Path $built.candidate 'stt-runtime.exe')" >> $env:GITHUB_ENV
          "STT_RUNTIME_STAGE=$($staged.configuration)" >> $env:GITHUB_ENV
          "STT_RUNTIME_MANIFEST=$($staged.manifest)" >> $env:GITHUB_ENV
          "STT_RUNTIME_SOURCE_MANIFEST=$($built.manifest)" >> $env:GITHUB_ENV
          "STT_RUNTIME_STORAGE_PROFILES_FILE=$(Join-Path $env:RUNNER_TEMP 'owned-storage-profiles.json')" >> $env:GITHUB_ENV
          "STT_RUNTIME_STORAGE_MASTER_KEY_FILE=$(Join-Path $env:RUNNER_TEMP 'owned-storage-key')" >> $env:GITHUB_ENV
          "STT_RUNTIME_CANON_PROVIDER_PROFILES_FILE=$(Join-Path $env:RUNNER_TEMP 'owned-provider-profiles.enc')" >> $env:GITHUB_ENV
      - name: Probe frozen runtime without developer PATH
        run: |
          $previousPath = $env:PATH
          try {
            $env:PATH = Join-Path $env:RUNNER_TEMP 'no-developer-tools'
            & $env:STT_TEST_DESKTOP_RUNTIME_EXECUTABLE --self-check
            if ($LASTEXITCODE -ne 0) { throw 'frozen self-check failed' }
          } finally { $env:PATH = $previousPath }
          uv run pytest services/runtime/tests/test_desktop_runtime.py services/runtime/tests/test_desktop_lifecycle.py -ra --junitxml="$env:RUNNER_TEMP/frozen.xml"
          if ($LASTEXITCODE -ne 0) { throw 'frozen lifecycle failed' }
          uv run python tools/check-ci-test-report.py "$env:RUNNER_TEMP/frozen.xml" --no-skips
          if ($LASTEXITCODE -ne 0) { throw 'frozen coverage incomplete' }
      - name: Verify native supervisor and real frozen handshake
        run: |
          pnpm desktop:config:test
          if ($LASTEXITCODE -ne 0) { throw 'resource contract failed' }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'native tests failed' }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml runtime_supervisor::tests::real_frozen_child_handshake -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'frozen handshake failed' }
      - name: Generate platform icon and package NSIS
        run: |
          $icons = Join-Path $env:RUNNER_TEMP 'desktop-icons'
          pnpm --dir apps/desktop exec tauri icon src-tauri/icons/icon.png --output $icons
          if ($LASTEXITCODE -ne 0) { throw 'icon conversion failed' }
          $configuration = Get-Content -Raw $env:STT_RUNTIME_STAGE | ConvertFrom-Json -AsHashtable
          $configuration.bundle.icon = @((Join-Path $icons 'icon.ico'))
          $configuration.bundle.windows = @{ webviewInstallMode = @{ type = 'offlineInstaller'; silent = $true } }
          $configuration | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 $env:STT_RUNTIME_STAGE
          pnpm --dir apps/desktop exec tauri build --bundles nsis --config $env:STT_RUNTIME_STAGE -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
      - name: Record candidate source and checksums
        run: |
          $destination = 'dist/windows-candidate'
          New-Item -ItemType Directory -Path $destination -ErrorAction Stop
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected one fresh NSIS installer' }
          # Candidate upload is distribution too; do not fake notice readiness.
          if (-not (Test-Path THIRD_PARTY_NOTICES.md) -or (Get-Item THIRD_PARTY_NOTICES.md).Length -eq 0) { throw 'Reviewed THIRD_PARTY_NOTICES.md is required before uploading binaries' }
          Copy-Item $installers[0].FullName $destination
          Copy-Item LICENSE $destination
          Copy-Item THIRD_PARTY_NOTICES.md $destination
          Copy-Item $env:STT_RUNTIME_MANIFEST "$destination/runtime-manifest.json"
          Copy-Item $env:STT_RUNTIME_SOURCE_MANIFEST "$destination/source-manifest.json"
          @{ schema_version = 1; source_commit = $env:GITHUB_SHA; runner_image = $env:ImageVersion; architecture = 'x64'; signed = $false; windows_11_acceptance = 'pending'; webview_install_mode = 'offlineInstaller' } | ConvertTo-Json | Set-Content -Encoding utf8 "$destination/candidate.json"
          $hashes = @(Get-ChildItem $destination -File | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" })
          $hashes | Set-Content -Encoding utf8 "$destination/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-candidate-${{ github.sha }}
          path: dist/windows-candidate
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-tests-${{ github.sha }}
          path: ${{ runner.temp }}/frozen.xml
          retention-days: 7
