services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: something_to_tell_test
      POSTGRES_PASSWORD: stt_test_password
      POSTGRES_USER: stt_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stt_test -d something_to_tell_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
